<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习看板</title>
<style>{{STUDY_AGENT_CSS}}</style>
</head>
<body>
<header>
  <h1>学习看板</h1>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <input id="q" aria-label="搜索资料" placeholder="搜索资料">
  <!-- 学科切换器（卡 C-0039）：顶栏最右侧，刻意放在搜索框**之后**。
       宽度交给 CSS（见 header #q / .subj），窄屏下先缩搜索框、再换行。 -->
  <div class="subj" id="subj">
    <button class="ghost" id="subj-btn" title="切换学科知识库（课件与知识点按学科完全独立）">
      <span>📚</span><span class="sname" id="subj-name">加载中…</span>
      <span class="scaret">▼</span>
    </button>
    <div class="subjmenu" id="subj-menu"></div>
  </div>
  <!-- 设置中心（卡 C-0059）：需求 6 要的「页面右上角设置栏」。刻意放在学科
       切换器**之后**（全页最右）；点开是模态窗而不是新页签，视线不离开当前页。 -->
  <button class="ghost" id="set-btn" title="设置">
    <span>⚙</span><span>设置</span>
  </button>
</header>
<main>
  <!-- 首次运行引导（卡 C-0071）：空库三步 / 未配密钥。由 loadFirstrun() 填充；
       空着时 `#firstrun:empty` 直接不占位。 -->
  <div id="firstrun"></div>
  <div id="ingest-progress"></div>
  <div id="view"></div>
</main>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>
<!-- 设置中心（卡 C-0059）：独立容器，不复用 #modal —— 它有自己的左栏导航、
     固定底栏与提示词编辑器，混用会把别的卡的弹窗逻辑搅在一起。 -->
<div class="modal set-modal" id="setmodal"><div class="setbox" id="setbox"></div></div>
<div class="guide-layer" id="guide-layer" aria-hidden="true">
  <div class="guide-shade" id="guide-shade-top"></div>
  <div class="guide-shade" id="guide-shade-left"></div>
  <div class="guide-shade" id="guide-shade-right"></div>
  <div class="guide-shade" id="guide-shade-bottom"></div>
  <div class="guide-hole" id="guide-hole"></div>
  <div class="guide-card" id="guide-card" role="dialog" aria-modal="true" aria-labelledby="guide-title" aria-live="polite"></div>
</div>

<script>{{STUDY_AGENT_JS}}</script>
</body>
</html>
